[package]
name = "vtk-wrap"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/awoimbee/vtk-wrap"
authors = ["vtk-wrap contributors"]
description = "Unsafe Rust bindings to VTK"
links = "vtk_wrap_shim"

[lib]
name = "vtk_wrap"
# Upstream doxygen comments contain C++ code, not Rust doctests.
doctest = false

[build-dependencies]
anyhow = "1"
cmake = "0.1"
convert_case = "0.12"
fs2 = "0.4"
roxmltree = "0.21"
serde_json = "1"

# One feature per wrapped VTK module, selecting native libraries and
# the generated bindings to compile.  The default
# set is the minimum: CommonCore (the object model), CommonDataModel (datasets)
# and FiltersCore (the pipeline filters), plus the modules they require.
[features]
default = ["vtkCommonCore", "vtkCommonDataModel", "vtkFiltersCore"]
# Deliberately unchecked native diagnostics; never enabled by default.
crash-hunt = []
raw-rendering-tests = []
vtkCommonColor = ["vtkCommonCore", "vtkCommonDataModel"]
vtkCommonCore = []
vtkCommonDataModel = ["vtkCommonCore", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms"]
vtkCommonExecutionModel = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonMisc", "vtkCommonSystem"]
vtkCommonMath = ["vtkCommonCore"]
vtkCommonMisc = ["vtkCommonCore", "vtkCommonMath"]
vtkCommonSystem = ["vtkCommonCore"]
vtkCommonTransforms = ["vtkCommonCore", "vtkCommonMath"]
vtkFiltersCore = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms"]
vtkFiltersGeneral = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeometry"]
vtkFiltersGeometry = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkFiltersCore"]
vtkFiltersSources = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral"]
vtkIOCore = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMisc"]
vtkIOGeometry = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersGeneral", "vtkIOCore", "vtkIOImage", "vtkIOLegacy", "vtkImagingCore", "vtkRenderingCore"]
vtkIOImage = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms", "vtkIOCore", "vtkImagingCore"]
vtkIOLegacy = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMisc", "vtkIOCore"]
vtkIOPLY = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonMisc", "vtkIOCore"]
vtkImagingCore = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonTransforms"]
vtkImagingHybrid = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkIOImage", "vtkImagingCore"]
vtkInteractionStyle = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersSources", "vtkRenderingCore"]
vtkInteractionWidgets = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral", "vtkFiltersSources", "vtkImagingCore", "vtkImagingHybrid", "vtkInteractionStyle", "vtkRenderingAnnotation", "vtkRenderingContext2D", "vtkRenderingCore", "vtkRenderingFreeType", "vtkRenderingVolume"]
vtkRenderingAnnotation = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral", "vtkFiltersSources", "vtkRenderingCore", "vtkRenderingFreeType"]
vtkRenderingCellGrid = ["vtkCommonColor", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkRenderingCore", "vtkRenderingOpenGL2"]
vtkRenderingContext2D = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersGeneral", "vtkRenderingCore", "vtkRenderingFreeType"]
vtkRenderingContextOpenGL2 = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonMath", "vtkCommonTransforms", "vtkImagingCore", "vtkRenderingContext2D", "vtkRenderingCore", "vtkRenderingFreeType", "vtkRenderingOpenGL2"]
vtkRenderingCore = ["vtkCommonColor", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral", "vtkFiltersGeometry", "vtkFiltersSources"]
vtkRenderingFreeType = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkFiltersGeneral", "vtkRenderingCore"]
vtkRenderingHyperTreeGrid = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkRenderingCore"]
vtkRenderingImage = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonTransforms", "vtkImagingCore", "vtkRenderingCore"]
vtkRenderingLOD = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkFiltersCore", "vtkRenderingCore"]
vtkRenderingLabel = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersGeneral", "vtkImagingCore", "vtkRenderingCore", "vtkRenderingFreeType"]
vtkRenderingOpenGL2 = ["vtkCommonColor", "vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersGeneral", "vtkIOCore", "vtkIOImage", "vtkImagingCore", "vtkRenderingCore", "vtkRenderingFreeType", "vtkRenderingHyperTreeGrid", "vtkRenderingLabel", "vtkRenderingUI"]
vtkRenderingUI = ["vtkRenderingCore"]
vtkRenderingVolume = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonExecutionModel", "vtkCommonMath", "vtkCommonMisc", "vtkCommonSystem", "vtkCommonTransforms", "vtkImagingCore", "vtkRenderingCore"]
vtkRenderingVolumeOpenGL2 = ["vtkCommonCore", "vtkCommonDataModel", "vtkCommonMath", "vtkCommonSystem", "vtkCommonTransforms", "vtkFiltersCore", "vtkFiltersGeneral", "vtkFiltersSources", "vtkImagingCore", "vtkRenderingCore", "vtkRenderingOpenGL2", "vtkRenderingVolume"]

# Examples and tests that use modules outside the default feature set are only
# built when those features are on, so `cargo build`/`cargo test` stay small.
[[example]]
name = "sphere_source"
required-features = ["vtkFiltersSources"]

[[example]]
name = "inspect"
required-features = ["vtkIOCore"]

[[example]]
name = "diag"
required-features = ["vtkFiltersSources", "vtkRenderingOpenGL2"]

# The opt-in diagnostics are generated for the enabled module set.
[[test]]
name = "smoke"
harness = false
required-features = ["crash-hunt"]

[[test]]
name = "pipeline"
required-features = ["vtkFiltersSources"]

# The rendering test drives VTK's OpenGL backend directly.  On macOS that
# creates an `NSWindow` (VTK's Cocoa backend does so even when offscreen
# rendering is on), and AppKit requires window creation on the *main* thread,
# while the built-in libtest harness runs every test on a worker thread.
# The smoke and rendering tests therefore run through their own `main`, which
# keeps them on the main thread and makes a crash identify its class.
[[test]]
name = "rendering"
harness = false
required-features = ["vtkRenderingOpenGL2", "raw-rendering-tests"]

[dev-dependencies]
trybuild = "1"
anyhow = "1"
convert_case = "0.12"
roxmltree = "0.21"

[profile.dev]
debug = 1
