# Configuration for `typos` (https://github.com/crate-ci/typos), run as a
# pre-commit/prek hook.
#
# It spell-checks identifiers and comments, splitting them into words, which
# makes it a good fit for hand-written code and a bad fit for the generated
# bindings: those embed VTK's doxygen comments and thousands of upstream
# identifiers verbatim, and are rewritten from scratch on every regeneration.
# The retained snapshots under `[files] extend-exclude` are emitted by the
# generator for documentation builds; normal generated files live under target.

[files]
extend-exclude = [
  # Rust-only documentation snapshots (one file per VTK module and an index).
  "doc_snapshots/",
  # `Cargo.lock` is generated and full of upstream crate names.
  "Cargo.lock",
]

[default]
# `typos` splits `PNGs` into `PN` + `Gs` and corrects `PN` to `ON`.  Plain
# `PNG` is fine; only the plural trips it.  Allow the whole family.
extend-ignore-identifiers-re = ["(?i)pngs?"]
