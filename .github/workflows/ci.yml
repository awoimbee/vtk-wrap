# Continuous integration.
#
# Two jobs:
#   * `lint`  -- formatting, spelling and a security audit of the workflow
#                itself.  Runs on Linux, needs no VTK, finishes in well under a
#                minute, and gates everything else.
#   * `build` -- vtk-wrap (native VTK + shim + Rust) on Linux, macOS
#                and Windows, plus the fast tests.
#
# ── Current status of `build` ──────────────────────────────────────────
# Linux and macOS build and test the non-rendering modules and block PRs.
# Windows remains non-blocking: native link reconstruction currently requires a
# Makefile generator, while Windows defaults to Visual Studio.
# Bindings are generated from each job's VTK installation. Linux additionally
# compiles the OpenGL bindings without opening a window.
#
# Building VTK from source dominates the runtime (~8 minutes on a fast machine,
# more on a hosted runner).  The `VTK_WRAP_CACHE_DIR` cache keeps the built VTK and
# shim between runs, so only the first run on each OS pays for it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the (large) VTK + shim build tree outside `target/` so the Rust and
  # native caches are independent.
  VTK_WRAP_CACHE_DIR: ${{ github.workspace }}/.vtk-wrap-cache

# Nothing here needs to write to the repository, so ask for the minimum.
# zizmor's `excessive-permissions` audit checks for this.
permissions:
  contents: read

jobs:
  # Formatting (`cargo fmt`), spelling (`typos`) and GitHub Actions security
  # (`zizmor`), all via the hooks in `.pre-commit-config.yaml`.  Cheap enough
  # that it is worth running on every PR before the multi-minute native build.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The `cargo fmt` hook is `language: system`, so it needs a `cargo` on
      # PATH (with the rustfmt component) rather than a hook-provided one.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt

      # Runs every hook over the whole tree and prints the diff on failure.
      # `0.5.4` matches the version the hook config is developed against.
      - name: Run pre-commit hooks
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: 0.5.4

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The VTK build plus the shim plus the Rust crates; generous but bounded.
    timeout-minutes: 120
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      # Report every platform, do not stop at the first failure.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            blocking: true
          - os: ubuntu-latest
            blocking: true
          - os: windows-latest
            blocking: false
    steps:
      # Pinned to a commit SHA (zizmor's `unpinned-uses`) with the tag in a
      # comment so the intent survives; `persist-credentials: false` keeps the
      # checkout token out of the build (zizmor's `artipacked`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxt-dev libxrender-dev \
            libxi-dev libxrandr-dev libxcursor-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
          cmake --version
          c++ --version || true

      # Crate downloads only.  Recompiling the Rust crates from scratch costs
      # well under a minute once VTK is cached, so `target/` is not worth
      # caching: the repository cache is capped at 10 GB, and the VTK trees are
      # the expensive part.
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # The expensive native part: the VTK build tree and, keyed on its content,
      # the compiled shim.  `build.rs` reuses both when the key matches.
      - name: Cache VTK and shim
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VTK_WRAP_CACHE_DIR }}
          key: vtk-wrap-vtk-${{ runner.os }}-${{ hashFiles('build.rs', 'Cargo.toml', 'Cargo.lock', 'build_support/**', 'vendor/WrapVTK/**') }}
          restore-keys: |
            vtk-wrap-vtk-${{ runner.os }}-

      # Builds VTK, generates bindings and the shim, and compiles test targets.
      - name: Build crate and tests
        run: cargo build --tests --features vtkFiltersSources,vtkIOCore --locked

      # Cheap functional checks that do not need a window server.  The full
      # `smoke` sweep deliberately is not run here: it is a crash hunt that
      # walks into a known VTK segfault (see `scripts/crash-hunt.sh`).
      - name: Run fast tests
        run: |
          cargo test --features vtkFiltersSources,vtkIOCore --locked

      - name: Check Linux rendering bindings
        if: runner.os == 'Linux'
        run: cargo check -p vtk-wrap --features vtkRenderingOpenGL2 --locked
